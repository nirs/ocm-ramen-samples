# PVC based test vm.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora
spec:
  running: true
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: medium
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/size: medium
        kubevirt.io/domain: fedora
    spec:
      domain:
        cpu:
          cores:
            2
        devices:
          disks:
            - name: fedora
              disk:
                bus: virtio
          inputs:
            # Required for correct mouse tracking in VNC.
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - name: default
              model: virtio
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: fedora
          persistentVolumeClaim:
            claimName: fedora
